        ::-webkit-scrollbar {
            width: 10px;

            background: #ffe4e6;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #e11d48;
            border-radius: 10px;

        /* Cute Bouncing Animations */
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(3deg); }
        }
        .animate-float {
            animation: floatSlow 3s ease-in-out infinite;
        }

        @keyframes wiggle {

        }
        .btn-card:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
        }

        .fish-swimming {
            position: absolute;
            transition: transform 0.3s ease, top 1s ease, left 1s ease;
            cursor: pointer;
            user-select: none;
            will-change: transform, left, top;

            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        // SOUND ENGINE & AUDIO HELPER
        function playPopSound() {
            try {
                const synth = new Tone.Synth({
                    oscillator: { type: "triangle" },
                    envelope: { attack: 0.005, decay: 0.1, sustain: 0, release: 0.1 }
                }).toDestination();
                synth.triggerAttackRelease("C6", "8n");
            } catch (e) { console.log(e); }
        }

        function playSuccessSound() {
            try {
                const synth = new Tone.PolySynth().toDestination();
                synth.triggerAttackRelease(["C5", "E5", "G5", "C6"], "8n");
            } catch (e) { console.log(e); }
        }

        function playWrongSound() {
            try {
                const synth = new Tone.Synth().toDestination();
                synth.triggerAttackRelease("F3", "4n");
            } catch (e) { console.log(e); }
        }

        // BGM SYNTHESIZER ENGINE (Upbeat Cheerful Game Melody)
        let bgmSequence = null;
        let isBgmPlaying = false;

        function startCheerfulGameBGM() {
            try {
                if (isBgmPlaying) return;
                Tone.start();

                const synth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "triangle" },
                    envelope: { attack: 0.01, decay: 0.2, sustain: 0.1, release: 0.2 }
                }).toDestination();
                synth.volume.value = -12;

                const notes = [
                    { time: "0:0:0", note: "C5", duration: "8n" },
                    { time: "0:0:2", note: "E5", duration: "8n" },
                    { time: "0:1:0", note: "G5", duration: "8n" },
                    { time: "0:1:2", note: "C6", duration: "8n" },
                    { time: "0:2:0", note: "A5", duration: "8n" },
                    { time: "0:2:2", note: "F5", duration: "8n" },
                    { time: "0:3:0", note: "G5", duration: "4n" },

                    { time: "1:0:0", note: "D5", duration: "8n" },
                    { time: "1:0:2", note: "F5", duration: "8n" },
                    { time: "1:1:0", note: "A5", duration: "8n" },
                    { time: "1:1:2", note: "B5", duration: "8n" },
                    { time: "1:2:0", note: "G5", duration: "8n" },
                    { time: "1:2:2", note: "E5", duration: "8n" },
                    { time: "1:3:0", note: "C5", duration: "4n" }
                ];

                bgmSequence = new Tone.Part((time, value) => {
                    synth.triggerAttackRelease(value.note, value.duration, time);
                }, notes);

                bgmSequence.loop = true;
                bgmSequence.loopEnd = "2m";
                Tone.Transport.bpm.value = 115;
                Tone.Transport.start();
                bgmSequence.start(0);

                isBgmPlaying = true;
            } catch (e) {
                console.log("Audio autoplay prevented or error:", e);
            }
        }

        function stopGameBGM() {
            try {
                if (bgmSequence) {
                    bgmSequence.stop();
                    bgmSequence.dispose();
                    bgmSequence = null;
                }
                Tone.Transport.stop();
                isBgmPlaying = false;
            } catch (e) {
                console.log(e);
            }
        }

        // TEXT TO SPEECH (Audio Reading)
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop ongoing speech
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'id-ID';
                utterance.rate = 0.9;
                utterance.pitch = 1.1;
                window.speechSynthesis.speak(utterance);
            }
        }

        function spawnFishes(playerNum) {
            const sea = document.getElementById(`p${playerNum}-sea`);
            const canvas = document.getElementById(`p${playerNum}-canvas`);
            if (!sea || !canvas) return;

            // Resize canvas to match container size
            canvas.width = sea.parentElement.clientWidth;
            canvas.height = sea.parentElement.clientHeight;

            sea.innerHTML = '';
            const seaWidth = sea.clientWidth || 350;
            const seaHeight = sea.clientHeight || 250;

            const shuffled = [...fishingQuestions].sort(() => Math.random() - 0.5);

            // Marine Creatures dictionary
            const creaturesConfig = [
                { type: 'squid', icon: '🦑', bobbing: true },
                { type: 'jellyfish', icon: '🪼', bobbing: true },
                { type: 'squid', icon: '🐙', bobbing: true },
                { type: 'fish', icon: '🐟', bobbing: false },
                { type: 'fish', icon: '🐠', bobbing: false },
                { type: 'fish', icon: '🐡', bobbing: false },
                { type: 'bonus', icon: '🐬🌟', bobbing: false },
                { type: 'bonus', icon: '🦈🌟', bobbing: false },
                { type: 'crab', icon: '🦀', bobbing: false },
                { type: 'shrimp', icon: '🦐', bobbing: false }
            ];

            for (let i = 0; i < 15; i++) {
                const q = shuffled[i % shuffled.length];
                const cfg = creaturesConfig[i % creaturesConfig.length];

                const creature = document.createElement('div');
                creature.className = `fish-swimming text-3xl select-none hover:scale-125 ${cfg.bobbing ? 'bobbing-creature' : ''}`;
                creature.dataset.type = cfg.type;
                creature.dataset.bonus = q.isBonus;
                creature.innerHTML = q.isBonus ? (cfg.icon.includes('🌟') ? cfg.icon : cfg.icon + '🌟') : cfg.icon;

                // Random Initial Position inside sea bounds
                const topPos = 20 + Math.random() * (seaHeight - 70);
                const leftPos = 40 + Math.random() * (seaWidth - 80);
                creature.style.top = `${topPos}px`;
                creature.style.left = `${leftPos}px`;
                creature.dataset.posX = leftPos;
                creature.dataset.posY = topPos;
                creature.dataset.direction = Math.random() > 0.5 ? 1 : -1; // 1 = right, -1 = left

                creature.onclick = (event) => targetAndCastLine(playerNum, creature, q, event);
                sea.appendChild(creature);
            }

            // DYNAMIC SWIMMING & BOBBING MOVEMENT LOOP
            gameState.swimIntervals[playerNum] = setInterval(() => {
                const creatures = sea.querySelectorAll('.fish-swimming');
                const currentSeaWidth = sea.clientWidth || 350;
                const currentSeaHeight = sea.clientHeight || 250;

                creatures.forEach(c => {
                    let posX = parseFloat(c.dataset.posX) || 50;
                    let posY = parseFloat(c.dataset.posY) || 50;
                    let dir = parseInt(c.dataset.direction) || 1;
                    const type = c.dataset.type;

                    if (type === 'squid' || type === 'jellyfish') {
                        // Slow Vertical Up & Down Movement for Squids/Jellyfishes
                        posY += dir * (1.5 + Math.random() * 2);
                        if (posY < 20) { posY = 20; dir = 1; }
                        if (posY > currentSeaHeight - 60) { posY = currentSeaHeight - 60; dir = -1; }
                    } else {
                        // Dynamic Forward & Backward Horizontal Swimming for Fishes
                        posX += dir * (8 + Math.random() * 12);

                        // Flip orientation depending on direction
                        if (dir === 1) {
                            c.style.transform = 'scaleX(-1)'; // facing right
                        } else {
                            c.style.transform = 'scaleX(1)';  // facing left
                        }

                        // Rebound at boundaries
                        if (posX < 20) { posX = 20; dir = 1; }
                        if (posX > currentSeaWidth - 60) { posX = currentSeaWidth - 60; dir = -1; }
                    }

                    c.dataset.posX = posX;
                    c.dataset.posY = posY;
                    c.dataset.direction = dir;
                    c.style.left = `${posX}px`;
                    c.style.top = `${posY}px`;
                });
            }, 1000);
        }

        // ANIMATED FISHING LINE CASTING
        function targetAndCastLine(playerNum, creatureElement, questionData, event) {
            playPopSound();

            const canvas = document.getElementById(`p${playerNum}-canvas`);
            const rodTip = document.getElementById(`p${playerNum}-rod-tip`);
            if (!canvas || !rodTip) return;

            const ctx = canvas.getContext('2d');
            const canvasRect = canvas.getBoundingClientRect();
            const rodRect = rodTip.getBoundingClientRect();
            const targetRect = creatureElement.getBoundingClientRect();

            // Origin position (Tip of fishing rod)
            const startX = rodRect.left - canvasRect.left + 4;
            const startY = rodRect.top - canvasRect.top + 4;

            // Target position (Sea creature center)
            const targetX = targetRect.left - canvasRect.left + targetRect.width / 2;
            const targetY = targetRect.top - canvasRect.top + targetRect.height / 2;

            let progress = 0;

            function animateLine() {
                progress += 0.08;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                const currentX = startX + (targetX - startX) * Math.min(progress, 1);
                const currentY = startY + (targetY - startY) * Math.min(progress, 1);

                // Draw Fishing Line
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(currentX, currentY);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.setLineDash([4, 2]);
                ctx.stroke();

                // Draw Fishing Hook at tip
                ctx.beginPath();
                ctx.arc(currentX, currentY, 5, 0, Math.PI * 2);
                ctx.fillStyle = '#f59e0b';
                ctx.fill();

                if (progress < 1) {
                    requestAnimationFrame(animateLine);
                } else {
                    // Short delay then remove creature & show question modal
                    setTimeout(() => {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        creatureElement.remove();
                        showQuestionModal(playerNum, questionData);
                    }, 200);
                }
            }

            animateLine();
        }

        function showQuestionModal(playerNum, questionData) {
            const modal = document.getElementById(`p${playerNum}-modal`);
            modal.classList.remove('hidden');

            const isBonus = questionData.isBonus;
            modal.innerHTML = `
                <div class="bg-white text-gray-800 p-4 rounded-2xl w-full max-w-xs shadow-2xl space-y-3 border-4 border-amber-400">
                    <span class="text-xs font-bold px-2 py-1 ${isBonus ? 'bg-amber-400 text-amber-900' : 'bg-blue-100 text-blue-800'} rounded-full">
                        ${isBonus ? '⭐ SOAL BONUS (+5 Poin)' : '🐟 SOAL STANDAR (+1 Poin)'}
                    </span>
                    <p class="font-extrabold text-sm text-gray-800 font-fun">${questionData.q}</p>
                    
                    <div class="space-y-2">
                        ${questionData.choices.map((c, idx) => `
                            <button onclick="answerFishingQuestion(${playerNum}, ${idx === questionData.answer}, ${isBonus})" 
                                    class="w-full text-left p-2.5 bg-cyan-50 hover:bg-cyan-200 border border-cyan-300 rounded-xl text-xs font-bold text-cyan-900 shadow-sm transition">
                                ${['A', 'B', 'C'][idx]}. ${c}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function catchFish(playerNum, fishElement, questionData) {
            // Handled directly via targetAndCastLine
        }

        function answerFishingQuestion(playerNum, isCorrect, isBonus) {
            const modal = document.getElementById(`p${playerNum}-modal`);
            modal.classList.add('hidden');

            const player = playerNum === 1 ? gameState.player1 : gameState.player2;
            player.fishesLeft--;

            if (isCorrect) {
                playSuccessSound();
                const addedScore = isBonus ? 5 : 1;
                player.score += addedScore;
                alert(`🎉 Benar! Kamu mendapatkan +${addedScore} poin!`);
            } else {
                playWrongSound();
                alert("❌ Jawaban kurang tepat!");
            }

            // Update UI Score
            document.getElementById(`p${playerNum}-score`).innerText = player.score;
            document.getElementById(`p${playerNum}-fish-count`).innerText = player.fishesLeft;

            // Check Game End
            checkGameFinish();
        }

        function checkGameFinish() {
            let finished = false;
            if (gameState.mode === 1) {
                if (gameState.player1.fishesLeft <= 0) finished = true;
            } else {
                if (gameState.player1.fishesLeft <= 0 && gameState.player2.fishesLeft <= 0) finished = true;
            }

            if (finished) {
                if (gameState.swimIntervals[1]) clearInterval(gameState.swimIntervals[1]);
                if (gameState.swimIntervals[2]) clearInterval(gameState.swimIntervals[2]);
                playSuccessSound();
                setTimeout(() => {
                    showScoreboard();
                }, 500);
            }
        }

        function showScoreboard() {
            const container = document.getElementById('arena-container');
            let winnerText = "";

            if (gameState.mode === 1) {
                winnerText = `🏆 Selamat ${gameState.player1.name}! Skor Akhirmu: ${gameState.player1.score} Poin!`;
            } else {
                if (gameState.player1.score > gameState.player2.score) {
                    winnerText = `🏆 PEMENANG: ${gameState.player1.name} dengan ${gameState.player1.score} Poin!`;
                } else if (gameState.player2.score > gameState.player1.score) {
                    winnerText = `🏆 PEMENANG: ${gameState.player2.name} dengan ${gameState.player2.score} Poin!`;
                } else {
                    winnerText = `🤝 HASIL SERI! Kedua pemain hebat dengan skor ${gameState.player1.score}!`;
                }
            }

            container.innerHTML = `
                <div class="bg-amber-100 border-4 border-amber-400 p-8 rounded-3xl text-center space-y-4 max-w-md mx-auto shadow-2xl animate-bounce">
                    <span class="text-6xl">🏆</span>
                    <h3 class="text-2xl font-extrabold text-amber-900 font-fun">PAPAN SKOR PERMAINAN</h3>
                    <p class="text-lg font-bold text-emerald-700">${winnerText}</p>
                    
                    <div class="bg-white p-4 rounded-2xl shadow space-y-2 text-sm font-semibold">
                        <div class="flex justify-between">
                            <span>${gameState.player1.name}:</span>
                            <span class="font-bold text-amber-600">${gameState.player1.score} Poin</span>
                        </div>
                        ${gameState.mode === 2 ? `
                        <div class="flex justify-between border-t pt-2">
                            <span>${gameState.player2.name}:</span>
                            <span class="font-bold text-amber-600">${gameState.player2.score} Poin</span>
                        </div>
                        ` : ''}
                    </div>

                    <button onclick="startFishingGame()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-2xl shadow font-fun">
                        🔄 Main Lagi!
                    </button>
                </div>
            `;
        }
